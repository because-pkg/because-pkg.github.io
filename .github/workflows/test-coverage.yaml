# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

concurrency:
  group: test-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential gfortran libblas-dev liblapack-dev pkg-config
          curl --retry 5 --retry-delay 5 --retry-all-errors -fSL \
            "https://sourceforge.net/projects/mcmc-jags/files/JAGS/5.x/Source/JAGS-5.0.2.tar.gz/download" -o JAGS-5.0.2.tar.gz
          tar -xzf JAGS-5.0.2.tar.gz
          cd JAGS-5.0.2
          ./configure --prefix=/usr/local --libdir=/usr/local/lib
          make -j"$(nproc)"
          sudo make install
          cd ..
          rm -rf JAGS-5.0.2 JAGS-5.0.2.tar.gz
          echo "/usr/local/lib" | sudo tee /etc/ld.so.conf.d/jags.conf > /dev/null
          sudo ldconfig
          echo "JAGS_HOME=/usr/local" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/local/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> $GITHUB_ENV

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          covr::codecov(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(Sys.getenv("RUNNER_TEMP"), "package")
          )
        shell: Rscript {0}

      - name: Print failure log
        if: failure()
        run: |
          find "${RUNNER_TEMP:-/tmp}" -name "*.Rout*" -exec echo "=== {} ===" \; -exec cat {} \;
        shell: bash
