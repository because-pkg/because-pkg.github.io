# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: macOS-latest, r: "release" }
          - { os: windows-latest, r: "release" }
          - { os: ubuntu-latest, r: "devel", http-user-agent: "release" }
          - { os: ubuntu-latest, r: "release" }
          - { os: ubuntu-latest, r: "oldrel-1" }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y jags libjags-dev pkg-config libnlopt-dev libglpk-dev libxml2-dev \
          libcurl4-openssl-dev libharfbuzz-dev libfribidi-dev libfontconfig1-dev \
          libarchive-dev libgit2-dev libssh2-1-dev libssl-dev libfreetype6-dev
          echo "JAGS_HOME=/usr" >> $GITHUB_ENV

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config
          dmg_url="https://downloads.sourceforge.net/project/mcmc-jags/JAGS/4.x/Mac%20OS%20X/JAGS-4.3.2.dmg"
          fallback_url="https://sourceforge.net/projects/mcmc-jags/files/JAGS/4.x/Mac%20OS%20X/JAGS-4.3.2.dmg/download"
          curl -fsSL -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)" --retry 3 --retry-delay 5 -L "$dmg_url" -o /tmp/JAGS-4.3.2.dmg || \
          curl -fsSL -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)" --retry 3 --retry-delay 5 -L "$fallback_url" -o /tmp/JAGS-4.3.2.dmg
          hdiutil attach /tmp/JAGS-4.3.2.dmg -nobrowse -mountpoint /tmp/jags-mount
          sudo installer -pkg /tmp/jags-mount/JAGS-4.3.2.pkg -target /
          hdiutil detach /tmp/jags-mount
          rm -f /tmp/JAGS-4.3.2.dmg
          echo "JAGS_HOME=/usr/local" >> $GITHUB_ENV
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        env:
          JAGS_VERSION: "4.3.2"
        run: |
          $installer = "$env:TEMP\JAGS-$env:JAGS_VERSION.exe"
          $urls = @(
            "https://downloads.sourceforge.net/project/mcmc-jags/JAGS/4.x/Windows/JAGS-$env:JAGS_VERSION.exe",
            "https://sourceforge.net/projects/mcmc-jags/files/JAGS/4.x/Windows/JAGS-$env:JAGS_VERSION.exe/download",
            "https://downloads.sourceforge.net/project/mcmc-jags/JAGS/4.x/Windows/JAGS-4.3.1.exe"
          )
          $downloaded = $false
          foreach ($url in $urls) {
            Write-Host "Attempting download from: $url"
            curl.exe -fsSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" --retry 3 --retry-delay 5 -L $url -o $installer
            if ((Test-Path $installer) -and ((Get-Item $installer).Length -gt 1000000)) {
              $downloaded = $true
              Write-Host "Downloaded successfully ($((Get-Item $installer).Length) bytes)"
              break
            }
          }
          if (-not $downloaded) { throw "JAGS installer download failed from all mirror sources" }
          
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait
          
          # Wait up to 30s for JAGS installation directory to appear
          $jagsDir = $null
          for ($i = 0; $i -lt 30; $i++) {
            if (Test-Path "C:\Program Files\JAGS") {
              $jagsDir = Get-ChildItem "C:\Program Files\JAGS" -Directory | Select-Object -First 1
              if ($jagsDir -and (Test-Path "$($jagsDir.FullName)\x64\bin\jags.exe")) { break }
            }
            Start-Sleep -Seconds 1
          }
          
          if ($jagsDir) {
            $jagsPath = $jagsDir.FullName
            Write-Host "JAGS installed at: $jagsPath"
            Add-Content -Path $env:GITHUB_PATH -Value "$jagsPath\x64\bin"
            Add-Content -Path $env:GITHUB_ENV -Value "JAGS_HOME=$jagsPath"
          } else {
            throw "Could not find installed JAGS in C:\Program Files\JAGS"
          }
        shell: pwsh

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: '"error"'
