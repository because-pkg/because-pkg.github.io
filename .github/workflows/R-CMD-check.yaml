# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: macOS-latest, r: "release" }
          - { os: windows-latest, r: "release" }
          - { os: ubuntu-latest, r: "devel", http-user-agent: "release" }
          - { os: ubuntu-latest, r: "release" }
          - { os: ubuntu-latest, r: "oldrel-1" }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y jags pkg-config libnlopt-dev libglpk-dev libxml2-dev \
          libcurl4-openssl-dev libharfbuzz-dev libfribidi-dev libfontconfig1-dev \
          libarchive-dev libgit2-dev libssh2-1-dev libssl-dev libfreetype6-dev
          echo "JAGS_HOME=/usr" >> $GITHUB_ENV

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config jags
          JAGS_PREFIX="$(brew --prefix)"
          echo "JAGS_HOME=$JAGS_PREFIX" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$JAGS_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "$JAGS_PREFIX/bin" >> $GITHUB_PATH

          # Symlink all JAGS libraries, modules, and headers to /usr/local
          # so CRAN binary rjags finds libjags, libjrmath & modules seamlessly
          sudo mkdir -p /usr/local/lib /usr/local/include
          for f in "$JAGS_PREFIX"/lib/*jags* "$JAGS_PREFIX"/lib/*jrmath*; do
            [ -e "$f" ] && sudo ln -sf "$f" /usr/local/lib/
          done
          [ -d "$JAGS_PREFIX/lib/JAGS" ] && sudo ln -sf "$JAGS_PREFIX/lib/JAGS" /usr/local/lib/
          [ -d "$JAGS_PREFIX/include/JAGS" ] && sudo ln -sf "$JAGS_PREFIX/include/JAGS" /usr/local/include/

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        env:
          JAGS_VERSION: "4.3.2"
        run: |
          $installer = "$env:TEMP\JAGS-$env:JAGS_VERSION.exe"
          $urls = @(
            "https://downloads.sourceforge.net/project/mcmc-jags/JAGS/4.x/Windows/JAGS-$env:JAGS_VERSION.exe",
            "https://sourceforge.net/projects/mcmc-jags/files/JAGS/4.x/Windows/JAGS-$env:JAGS_VERSION.exe/download",
            "https://downloads.sourceforge.net/project/mcmc-jags/JAGS/4.x/Windows/JAGS-4.3.1.exe"
          )
          $downloaded = $false
          foreach ($url in $urls) {
            Write-Host "Attempting download from: $url"
            curl.exe -fsSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" --retry 3 --retry-delay 5 -L $url -o $installer
            if ((Test-Path $installer) -and ((Get-Item $installer).Length -gt 1000000)) {
              $downloaded = $true
              Write-Host "Downloaded successfully ($((Get-Item $installer).Length) bytes)"
              break
            }
          }
          if (-not $downloaded) { throw "JAGS installer download failed from all mirror sources" }
          
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait
          
          # Dynamically locate installed JAGS directory
          $jagsDir = Get-ChildItem "C:\Program Files\JAGS" -Directory | Select-Object -First 1
          if ($jagsDir) {
            $jagsPath = $jagsDir.FullName
            Write-Host "JAGS installed at: $jagsPath"
            if (Test-Path "$jagsPath\x64\bin") {
              echo "$jagsPath\x64\bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
            }
            echo "JAGS_HOME=$jagsPath" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          } else {
            throw "Could not find installed JAGS in C:\Program Files\JAGS"
          }
        shell: pwsh

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: '"error"'
