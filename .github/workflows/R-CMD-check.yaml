# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: macOS-latest, r: "release" }
          - { os: windows-latest, r: "release" }
          - { os: ubuntu-latest, r: "devel", http-user-agent: "release" }
          - { os: ubuntu-latest, r: "release" }
          - { os: ubuntu-latest, r: "oldrel-1" }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential gfortran libblas-dev liblapack-dev pkg-config \
          libnlopt-dev libglpk-dev libxml2-dev libcurl4-openssl-dev libharfbuzz-dev libfribidi-dev libfontconfig1-dev \
          libarchive-dev libgit2-dev libssh2-1-dev libssl-dev libfreetype6-dev
          curl --retry 5 --retry-delay 5 --retry-all-errors -fSL \
            "https://sourceforge.net/projects/mcmc-jags/files/JAGS/5.x/Source/JAGS-5.0.2.tar.gz/download" -o JAGS-5.0.2.tar.gz
          tar -xzf JAGS-5.0.2.tar.gz
          cd JAGS-5.0.2
          ./configure --prefix=/usr/local --libdir=/usr/local/lib
          make -j"$(nproc)"
          sudo make install
          cd ..
          rm -rf JAGS-5.0.2 JAGS-5.0.2.tar.gz
          echo "/usr/local/lib" | sudo tee /etc/ld.so.conf.d/jags.conf > /dev/null
          sudo ldconfig
          echo "JAGS_HOME=/usr/local" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/local/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> $GITHUB_ENV

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          curl --retry 5 --retry-delay 5 --retry-all-errors -fSL \
            "https://sourceforge.net/projects/mcmc-jags/files/JAGS/5.x/macOS/JAGS-5.0.2-universal.pkg/download" -o JAGS-5.0.2-universal.pkg
          sudo installer -pkg JAGS-5.0.2-universal.pkg -target /
          rm -f JAGS-5.0.2-universal.pkg
          echo "JAGS_HOME=/opt/jags/versions/jags/current-5" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/opt/jags/lib/pkgconfig-5${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> $GITHUB_ENV
          echo "/opt/jags/bin" >> $GITHUB_PATH

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          if ("${{ runner.arch }}" -eq "ARM64") {
            $url = "https://github.com/r-universe-org/actions/releases/download/JAGS-4.3.2/JAGS-4.3.2-aarch64.exe"
          } else {
            $url = "https://sourceforge.net/projects/mcmc-jags/files/JAGS/5.x/Windows/Rtools45/JAGS-5.0.2.exe/download"
          }
          $jags = Join-Path $env:RUNNER_TEMP 'JAGS.exe'
          curl.exe --retry 5 --retry-delay 5 -fSL -o $jags $url
          Start-Process $jags -ArgumentList '/S','/AllUsers' -Wait
          $dir = Get-ChildItem 'C:\Program Files\JAGS\JAGS-*' | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $dir) { throw 'JAGS did not install' }
          $short = (New-Object -ComObject Scripting.FileSystemObject).GetFolder($dir.FullName).ShortPath
          Write-Host "Setting JAGS_ROOT=$short"
          Add-Content -Path $env:GITHUB_ENV -Value "JAGS_ROOT=$short"
          Add-Content -Path $env:GITHUB_ENV -Value "JAGS_HOME=$short"
          Add-Content -Path $env:GITHUB_PATH -Value "$($dir.FullName)\x64\bin"
        shell: pwsh

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: '"error"'
