# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: macOS-latest, r: "release" }
          - { os: windows-latest, r: "release" }
          - { os: ubuntu-latest, r: "devel", http-user-agent: "release" }
          - { os: ubuntu-latest, r: "release" }
          - { os: ubuntu-latest, r: "oldrel-1" }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y jags pkg-config libnlopt-dev libglpk-dev libxml2-dev \
          libcurl4-openssl-dev libharfbuzz-dev libfribidi-dev libfontconfig1-dev \
          libarchive-dev libgit2-dev libssh2-1-dev libssl-dev libfreetype6-dev
          echo "JAGS_HOME=/usr" >> $GITHUB_ENV

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          curl --retry 3 --fail-with-body -sSLO https://github.com/autobrew/bundler/releases/download/jags-4.3.2/JAGS-4.3.2.pkg
          sudo installer -pkg JAGS-4.3.2.pkg -target /
          rm -f JAGS-4.3.2.pkg
          if [ -d "/opt/R/arm64/lib/pkgconfig" ]; then
            sudo cp -f /usr/local/lib/pkgconfig/jags.pc /opt/R/arm64/lib/pkgconfig/ || true
          fi
          echo "JAGS_HOME=/usr/local" >> $GITHUB_ENV
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          if ("${{ runner.arch }}" -eq "ARM64") {
            $url = "https://github.com/r-universe-org/actions/releases/download/JAGS-4.3.2/JAGS-4.3.2-aarch64.exe"
          } else {
            $url = "https://github.com/r-universe-org/actions/releases/download/JAGS-4.3.1/JAGS-4.3.1.exe"
          }
          $jags = Join-Path $env:RUNNER_TEMP 'JAGS.exe'
          curl.exe -sSL -o $jags $url
          Start-Process $jags -ArgumentList '/S','/AllUsers' -Wait
          $dir = Get-ChildItem 'C:\Program Files\JAGS\JAGS-*' | Select-Object -First 1
          if (-not $dir) { throw 'JAGS did not install' }
          $short = (New-Object -ComObject Scripting.FileSystemObject).GetFolder($dir.FullName).ShortPath
          Write-Host "Setting JAGS_ROOT=$short"
          Add-Content -Path $env:GITHUB_ENV -Value "JAGS_ROOT=$short"
          Add-Content -Path $env:GITHUB_ENV -Value "JAGS_HOME=$short"
          Add-Content -Path $env:GITHUB_PATH -Value "$($dir.FullName)\x64\bin"
        shell: pwsh

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: '"error"'
