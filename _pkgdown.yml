url: https://because-pkg.github.io/because/
template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#0076BA"
    navbar-bg: "#0076BA"
navbar:
  structure:
    left: [home, reference, articles, extensions, news]
    right: [search, github]
  components:
    extensions:
      text: "Extensions"
      href: articles/extensions.html
    blog:
      text: "Blog"
      href: articles/announcing-because.html

articles:
  - title: "Tutorials & User Guides"
    desc: "Comprehensive guides for Bayesian causal SEMs with because"
    contents:
      - '`01_getting_started`'
      - '`02_dseparation`'
      - '`03_model_diagnostics_comparison`'
      - '`04_mediation`'
      - '`05_non_gaussian_families`'
      - '`06_deterministic_nodes`'
      - '`07_custom_priors`'
      - '`08_multiscale_models`'
      - '`09_missing_data`'
      - '`10_nimble_engine`'
      - '`11_latent_variables_mag`'
      - '`12_custom_families`'
      - '`13_counterfactual_simulations`'
      - '`14_bayesian_diagnostics`'
  - title: "Ecosystem & Extensions"
    desc: "Extending because with specialized packages and domain models"
    contents:
      - '`extensions`'
  - title: "News & Releases"
    desc: "Release announcements and package updates"
    contents:
      - '`announcing-because`'

reference:
  - title: "Model Fitting & Estimation"
    desc: "Core functions for specifying and fitting Bayesian Structural Equation Models."
    contents:
      - because
      - because_model
      - because_continue
      - update.because
  - title: "Causal Evaluation & d-Separation"
    desc: "Tools for evaluating causal DAG consistency and testing conditional independencies."
    contents:
      - because_dsep
      - plot_dsep
      - plot_rope
  - title: "Causal Effects & Interventions"
    desc: "Functions for estimating marginal effects, causal mediation, and structural interventions."
    contents:
      - marginal_effects
      - because_mediation
      - because_do
      - do
  - title: "Model Diagnostics & Residual Analysis"
    desc: "Bayesian diagnostic suite for residual normality, homoscedasticity, collinearity, and residual structure."
    contents:
      - check_model
      - check_normality
      - check_homoscedasticity
      - check_collinearity
      - check_residual_structure
      - residuals.because
  - title: "Model Comparison & Prediction"
    desc: "Posterior predictive checks, information criteria, and prediction methods."
    contents:
      - summary.because
      - pp_check
      - predict.because
      - posterior_predict
      - extract_imputed
      - because_compare
      - because_loo
      - because_loo_compare
      - because_waic
  - title: "Visualization"
    desc: "Plotting methods for DAGs, coefficients, and posterior distributions."
    contents:
      - plot_dag
      - plot_coef
      - plot_posterior
      - plot_dsep
      - plot_rope
  - title: "Datasets & Utilities"
    desc: "Example datasets and setup helpers."
    contents:
      - storks
      - because_family
      - because_structure
      - because_format_data
      - get_family
      - install_because_numpyro
